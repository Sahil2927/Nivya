server:
  port: 8082

spring:
  application:
    name: kyc-service
  datasource:
    url: ${KYC_DB_URL:jdbc:postgresql://localhost:5432/nivya_kyc}
    username: ${KYC_DB_USER:postgres}
    password: ${KYC_DB_PASS:postgres}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration

nivya:
  kra:
    adapter: ${KRA_ADAPTER:mock}
  auth-service:
    base-url: ${AUTH_SERVICE_URL:http://localhost:8081}
  pan:
    encryption-key: ${NIVYA_PAN_ENCRYPTION_KEY:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=}
